# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

lmc_input: 9 # 送给原始第一层Conv的真实通道数

backbone:
  # [from, number, module, args]
  - [-1, 1, Identity, [9, 9]]        # 0
  - [0, 1, InputSel, [9, 3, rgb]]    # 1
  - [0, 1, InputSel, [9, 3, depth1]] # 2
  - [0, 1, InputSel, [9, 3, ir]]     # 3
  - [[1, 2, 3], 1, Concat, [1]]      # 4

  # ===== RGB Branch =====
  - [4, 1, Conv, [64, 3, 2]]         # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 6
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 10
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 12
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 14
  - [-1, 2, C2PSA, [1024]] # 15

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 11], 1, Concat, [1]] # cat backbone P4 # 17 (fused)
  - [-1, 2, C3k2, [512, False]] # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 9], 1, Concat, [1]] # cat backbone P3 # 20  (fused)
  - [-1, 2, C3k2, [256, False]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 18], 1, Concat, [1]] # cat head P4 23 (fused)
  - [-1, 2, C3k2, [512, False]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 15], 1, Concat, [1]] # cat head P5 # 26 (fused)
  - [-1, 2, C3k2, [1024, True]] # 27 (P5/32-large)

  - [[21, 24, 27], 1, Detect, [nc]] # Detect(P3, P4, P5) # 28 (fused)
