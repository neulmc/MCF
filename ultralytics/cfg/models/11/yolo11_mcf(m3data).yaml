# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 260 layers, 2,572,280 parameters, 2,572,280 gradients, 6.1 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 260 layers, 10,009,784 parameters, 10,009,784 gradients, 22.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 280 layers, 21,896,248 parameters, 21,896,248 gradients, 75.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 392 layers, 26,299,704 parameters, 26,299,704 gradients, 93.8 GFLOPs
  x: [1.00, 1.50, 512] # summary: 392 layers, 58,993,368 parameters, 58,993,368 gradients, 209.5 GFLOPs


lmc_input: 6 # 送给原始第一层Conv的真实通道数
# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Identity, [6, 6]] # 0-P1/2
  - [0, 1, InputSel_m3data, [6, 3, rgb]] # 1-P1/2
  - [0, 1, InputSel_m3data, [6, 3, ir]] # 2-P1/2

  - [1, 1, Conv, [64, 3, 2]] # 3-P1/2 (RGB)
  - [-1, 1, Conv, [128, 3, 2]] # 4-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 5
  - [-1, 1, Conv, [256, 3, 2]] # 6-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 7 (fuse1)
  - [-1, 1, Conv, [512, 3, 2]] # 8-P4/16
  - [-1, 2, C3k2, [512, True]] # 9 (fuse2)
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 2, C3k2, [1024, True]] # 11
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 12
  - [-1, 2, C2PSA, [1024]] # 13  (fuse3)

  - [2, 1, Conv, [32, 3, 2]] # 14-P1/2 (depth)
  - [-1, 1, Conv, [64, 3, 2]] # 15-P2/4
  - [-1, 2, PDCC2f, [128, abcd, 0.25]] # 16
  - [-1, 1, Conv, [128, 3, 2]] # 17-P3/8
  - [-1, 2, PDCC2f, [256, abcd, 0.25]] # 18
  - [-1, 1, Conv, [256, 3, 2]] # 19-P4/16
  - [-1, 2, C3k2, [256, True]] # 20
  - [-1, 1, Conv, [512, 3, 2]] # 21-P5/32
  - [-1, 2, C3k2, [512, True]] # 22
  - [-1, 1, SPPF, [512, 5, 3, True]] # 23
  - [-1, 2, C2PSA, [512]] # 24

  - [[7, 18], 1, BiMFBlock, [512, 24, 16, [3, 7]]] # 25
  - [[9, 20], 1, BiMFBlock, [512, 12, 16, [3, 7]]] # 26
  - [[13, 24], 1, BiMFBlock, [1024, 6, 16, [3, 7]]] # 27

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 28
  - [[-1, 26], 1, Concat, [1]] # cat backbone P4 # 29 (fused)
  - [-1, 2, C3k2, [512, True]] # 30

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 31
  - [[-1, 25], 1, Concat, [1]] # cat backbone P3 # 32  (fused)
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small) # 33

  - [-1, 1, Conv, [256, 3, 2]] # 34
  - [[-1, 30], 1, Concat, [1]] # cat head P4 35 (fused)
  - [-1, 2, C3k2, [512, True]] # 36 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 37
  - [[-1, 27], 1, Concat, [1]] # cat head P5 # 38 (fused)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 39 (P5/32-large)

  - [[33, 36, 39], 1, Detect, [nc]] # Detect(P3, P4, P5) # 40 (fused)
