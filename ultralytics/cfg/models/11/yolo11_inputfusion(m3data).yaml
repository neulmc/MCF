# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 260 layers, 2,572,280 parameters, 2,572,280 gradients, 6.1 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 260 layers, 10,009,784 parameters, 10,009,784 gradients, 22.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 280 layers, 21,896,248 parameters, 21,896,248 gradients, 75.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 392 layers, 26,299,704 parameters, 26,299,704 gradients, 93.8 GFLOPs
  x: [1.00, 1.50, 512] # summary: 392 layers, 58,993,368 parameters, 58,993,368 gradients, 209.5 GFLOPs

lmc_input: 6 # 送给原始第一层Conv的真实通道数
# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Identity, [6, 6]] # 0-P1/2
  - [0, 1, InputSel_m3data, [6, 3, rgb]] # 1-P1/2
  - [0, 1, InputSel_m3data, [6, 3, ir]] # 2-P1/2
  - [[1, 2], 1, Concat, [1]]      # 3

  - [1, 1, Conv, [64, 3, 2]] # 4-P1/2 (RGB)
  - [-1, 1, Conv, [128, 3, 2]] # 4-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 5
  - [-1, 1, Conv, [256, 3, 2]] # 6-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 8 (fuse1)
  - [-1, 1, Conv, [512, 3, 2]] # 9-P4/16
  - [-1, 2, C3k2, [512, True]] # 10 (fuse2)
  - [-1, 1, Conv, [1024, 3, 2]] # 11-P5/32
  - [-1, 2, C3k2, [1024, True]] # 12
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 13
  - [-1, 2, C2PSA, [1024]] # 14  (fuse3)

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 10], 1, Concat, [1]] # cat backbone P4 # 16 (fused)
  - [-1, 2, C3k2, [512, True]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18
  - [[-1, 8], 1, Concat, [1]] # cat backbone P3 # 19  (fused)
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small) # 20

  - [-1, 1, Conv, [256, 3, 2]] # 21
  - [[-1, 17], 1, Concat, [1]] # cat head P4 22 (fused)
  - [-1, 2, C3k2, [512, True]] # 23 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 24
  - [[-1, 14], 1, Concat, [1]] # cat head P5 # 25 (fused)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 26 (P5/32-large)

  - [[20, 23, 26], 1, Detect, [nc]] # Detect(P3, P4, P5) # 27 (fused)
