# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

lmc_input: 9 # 送给原始第一层Conv的真实通道数


backbone:
  # [from, number, module, args]
  - [-1, 1, Identity, [9, 9]]        # 0
  - [0, 1, InputSel, [9, 3, rgb]]    # 1
  - [0, 1, InputSel, [9, 3, depth1]] # 2
  - [0, 1, InputSel, [9, 3, ir]]     # 3
  - [[1, 2, 3], 1, Concat, [1]]      # 4

  # ===== RGB Branch =====
  - [4, 1, Conv, [64, 3, 2]]         # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 6
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]       # 8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]       # 10
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 12
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]         # 14 ← P5

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  #15
  - [[-1, 11], 1, Concat, [1]]       # 16 cat with P4
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]       # 18 cat with P3
  - [-1, 3, C2f, [256]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]       # 20
  - [[-1, 17], 1, Concat, [1]]       # 21 cat head P4
  - [-1, 3, C2f, [512]] # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]       # 23
  - [[-1, 14], 1, Concat, [1]]       # 24 cat head P5
  - [-1, 3, C2f, [1024]] # 25

  - [[20, 23, 26], 1, Detect, [nc]]  # 26 Detect(P3, P4, P5)