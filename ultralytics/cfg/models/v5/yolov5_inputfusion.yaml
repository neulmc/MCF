# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo26n.yaml' will call yolo26.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 1024]
  l: [1.00, 1.00, 1024]
  x: [1.33, 1.25, 1024]

lmc_input: 9 # 送给原始第一层Conv的真实通道数


backbone:
  # [from, number, module, args]
  - [-1, 1, Identity, [9, 9]]        # 0
  - [0, 1, InputSel, [9, 3, rgb]]    # 1
  - [0, 1, InputSel, [9, 3, depth1]] # 2
  - [0, 1, InputSel, [9, 3, ir]]     # 3
  - [[1, 2, 3], 1, Concat, [1]]      # 4

  # ===== RGB Branch =====
  - [4, 1, Conv, [64, 6, 2, 2]]      # 5
  - [-1, 1, Conv, [128, 3, 2]]       # 6
  - [-1, 3, C3, [128]]               # 7
  - [-1, 1, Conv, [256, 3, 2]]       # 8
  - [-1, 6, C3, [256]]               # 9  ← P3
  - [-1, 1, Conv, [512, 3, 2]]       # 10
  - [-1, 9, C3, [512]]               # 11 ← P4
  - [-1, 1, Conv, [1024, 3, 2]]      # 12
  - [-1, 3, C3, [1024]]              # 13
  - [-1, 1, SPPF, [1024, 5]]         # 14 ← P5

# Head
head:
  - [-1, 1, Conv, [512, 1, 1]]       # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 11], 1, Concat, [1]]       # 17 cat with P4
  - [-1, 3, C3, [512, False]]        # 18

  - [-1, 1, Conv, [256, 1, 1]]       # 19
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]       # 21 cat with P3
  - [-1, 3, C3, [256, False]]        # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]       # 23
  - [[-1, 19], 1, Concat, [1]]       # 24 cat head P4
  - [-1, 3, C3, [512, False]]        # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]       # 26
  - [[-1, 15], 1, Concat, [1]]       # 27 cat head P5
  - [-1, 3, C3, [1024, False]]       # 28 (P5/32-large)

  - [[22, 25, 28], 1, Detect, [nc]]  # 29 Detect(P3, P4, P5)