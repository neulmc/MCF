# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

lmc_input: 9 # 送给原始第一层Conv的真实通道数


backbone:
  # [from, number, module, args]
  - [-1, 1, Identity, [9, 9]]        # 0
  - [0, 1, InputSel, [9, 3, rgb]]    # 1
  - [0, 1, InputSel, [9, 3, depth1]] # 2
  - [0, 1, InputSel, [9, 3, ir]]     # 3

  # ===== RGB Branch =====
  - [1, 1, ResNetLayer, [3, 64, 1, True, 1]] # 4
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 3]] # 5
  - [-1, 1, ResNetLayer, [256, 128, 2, False, 4]] # 6
  - [-1, 1, ResNetLayer, [512, 256, 2, False, 6]] # 7
  - [-1, 1, ResNetLayer, [1024, 512, 2, False, 3]] # 8

  # ===== Depth Branch =====
  - [2, 1, ResNetLayer, [3, 64, 1, True, 1]] # 9
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 3]] # 10
  - [-1, 1, ResNetLayer, [256, 128, 2, False, 4]] # 11
  - [-1, 1, ResNetLayer, [512, 256, 2, False, 6]] # 12
  - [-1, 1, ResNetLayer, [1024, 512, 2, False, 3]] # 13

  # ===== IR Branch =====
  - [3, 1, ResNetLayer, [3, 64, 1, True, 1]] # 14
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 3]] # 15
  - [-1, 1, ResNetLayer, [256, 128, 2, False, 4]] # 16
  - [-1, 1, ResNetLayer, [512, 256, 2, False, 6]] # 17
  - [-1, 1, ResNetLayer, [1024, 512, 2, False, 3]] # 18

  # ===== Multi-modal Fusion =====
  - [[6, 11, 16], 1, Concat, [1]]         # 19 ← RGB_P3 + Depth_P3 + IR_P3
  - [[7, 12, 17], 1, Concat, [1]]         # 20 ← RGB_P4 + Depth_P4 + IR_P4
  - [[8, 13, 18], 1, Concat, [1]]        # 21 ← RGB_P5 + Depth_P5 + IR_P5

# Head
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 22
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # 24

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [20, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 26
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 28
  - [-1, 1, Conv, [256, 1, 1]] # 29

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [19, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 31
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [256]] # X3 (16), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 34, downsample_convs.0
  - [[-1, 29], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [256]] # F4 (19), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 37, downsample_convs.1
  - [[-1, 24], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [256]] # F5 (22), pan_blocks.1

  - [[33, 36, 39], 1, RTDETRDecoder, [nc]] # RTDETRDecoder(P3, P4, P5)
