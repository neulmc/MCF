# Ultralytics YOLO26 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

lmc_input: 9 # 送给原始第一层Conv的真实通道数


backbone:
  # [from, number, module, args]
  - [-1, 1, Identity, [9, 9]]        # 0
  - [0, 1, InputSel, [9, 3, rgb]]    # 1
  - [0, 1, InputSel, [9, 3, depth1]] # 2
  - [0, 1, InputSel, [9, 3, ir]]     # 3
  - [[1, 2, 3], 1, Concat, [1]]      # 4

  # ===== RGB Branch =====
  - [4, 1, ResNetLayer, [9, 64, 1, True, 1]] # 5
  - [-1, 1, ResNetLayer, [64, 64, 1, False, 3]] # 6
  - [-1, 1, ResNetLayer, [256, 128, 2, False, 4]] # 7
  - [-1, 1, ResNetLayer, [512, 256, 2, False, 6]] # 8
  - [-1, 1, ResNetLayer, [1024, 512, 2, False, 3]] # 9

# Head
head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 10
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [8, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 14
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]] # 16
  - [-1, 1, Conv, [256, 1, 1]] # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 19
  - [[-2, -1], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, RepC3, [256]] # X3 (21), fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 34, downsample_convs.0
  - [[-1, 17], 1, Concat, [1]] # cat Y4
  - [-1, 3, RepC3, [256]] # F4 (24), pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 25, downsample_convs.1
  - [[-1, 12], 1, Concat, [1]] # cat Y5
  - [-1, 3, RepC3, [256]] # F5 (27), pan_blocks.1

  - [[21, 24, 27], 1, RTDETRDecoder, [nc]] # RTDETRDecoder(P3, P4, P5)
